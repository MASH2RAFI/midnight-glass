# ===== Midnight Glass — glass Hyprland =====================================
# Omarchy-compatible: sourced as ~/.config/omarchy/current/theme/hyprland.conf
# Ships with the theme so other Omarchy themes stay untouched when switching.

$activeBorderColor = rgba(5F8282ee) rgba(537272cc) 45deg
$inactiveBorderColor = rgba(212B2Baa)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor

    gaps_in = 2
    gaps_out = 0
    border_size = 2
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    rounding = 12

    # Dim softens glyphs on unfocused windows — keep it subtle
    dim_inactive = true
    dim_strength = 0.05

    shadow {
        enabled = false
    }

    blur {
        enabled = true
        size = 8
        passes = 4
        vibrancy = 0.12
        special = true
        brightness = 0.65
        contrast = 0.85
        # Blur wallpaper behind the window without washing opaque text
        ignore_opacity = true
    }
}

animations {
    bezier = matteOut, 0.16, 1, 0.3, 1
    bezier = matteLinear, 0, 0, 1, 1

    animation = global, 1, 8, matteOut
    animation = border, 1, 4, matteOut
    animation = windows, 1, 3, matteOut
    animation = windowsIn, 1, 3.2, matteOut, popin 92%
    animation = windowsOut, 1, 1.4, matteLinear, popin 92%
    animation = fade, 1, 2.2, matteOut
    animation = layers, 1, 3, matteOut
    animation = workspaces, 1, 2.4, matteOut, slidefade 12%
    animation = specialWorkspace, 1, 2.6, matteOut, slidevert
}

# Terminals handle their own background opacity; keep text fully opaque here.
windowrule = tag -default-opacity, match:class ^(Alacritty|kitty|com\.mitchellh\.ghostty|foot|org\.gnome\.Terminal)$
windowrule = opacity 1 1, match:class ^(Alacritty|kitty|com\.mitchellh\.ghostty|foot|org\.gnome\.Terminal)$

# Near-opaque UI so glyphs stay sharp; blur still frosts the wallpaper behind
windowrule = opacity 0.97 0.94, match:tag default-opacity

# Editors: fully sharp text (bg glass comes from blur only)
windowrule = opacity 1 1, match:class ^(cursor|Cursor|code-oss|Code|code)$

# Frosted glass behind translucent shell layers
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.15, match:namespace waybar
layerrule = blur on, match:namespace walker
layerrule = ignore_alpha 0.15, match:namespace walker
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.15, match:namespace notifications
