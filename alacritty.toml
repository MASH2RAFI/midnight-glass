# Midnight Glass — colors + background-only transparency (text stays opaque)

[window]
opacity = 0.40

[colors.primary]
background = "#040405"
foreground = "#B8B7BC"

[colors.cursor]
text = "#040405"
cursor = "#B8B7BC"

[colors.vi_mode_cursor]
text = "#040405"
cursor = "#B8B7BC"

[colors.search.matches]
foreground = "#040405"
background = "#8E625D"

[colors.search.focused_match]
foreground = "#040405"
background = "#856462"

[colors.footer_bar]
foreground = "#040405"
background = "#B8B7BC"

[colors.selection]
text = "#B8B7BC"
background = "#262835"

[colors.normal]
black = "#040405"
red = "#856462"
green = "#A28876"
yellow = "#8E625D"
blue = "#93737A"
magenta = "#856462"
cyan = "#8E625D"
white = "#B8B7BC"

[colors.bright]
black = "#262835"
red = "#856462"
green = "#A28876"
yellow = "#8E625D"
blue = "#93737A"
magenta = "#856462"
cyan = "#B8B7BC"
white = "#FFFFFF"
